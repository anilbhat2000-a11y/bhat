# Nginx in front of the LMS app. TLS terminates here; the app listens only on the internal
# Docker network. Certificates are mounted at /etc/nginx/certs (see make-cert.sh).

# The app runs as several replicas (APP_REPLICAS). Docker's DNS returns one address per
# replica; proxy_pass with a variable makes Nginx re-resolve "app" every 10 seconds and
# spread requests across all of them, so recreated or added replicas are picked up
# without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  set $lms_app http://app:3000;

  ssl_certificate     /etc/nginx/certs/lms.crt;
  ssl_certificate_key /etc/nginx/certs/lms.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Largest upload: a 500 MB video plus form overhead (matches MAX_UPLOAD_MB_VIDEO).
  client_max_body_size 550m;

  # Compress pages and scripts. Media is already compressed, and file routes serve byte
  # ranges that must match the bytes on disk, so they are excluded below.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  # $http_host keeps the port the browser used. Next.js compares it with the Origin header
  # on every form submit (CSRF protection), so dropping the port breaks sign-in.
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_read_timeout 300s;

  # Uploads stream straight to the app instead of being buffered to Nginx's disk first.
  # Course and bulk uploads carry many files at once (each file still has its own limit in
  # the app), so these routes allow up to 4 GB and 30 minutes.
  location /api/upload/ {
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_pass $lms_app;
  }

  # Video and documents: byte ranges pass through untouched, without gzip.
  location ~ ^/api/(files|captions|photos|certificates)/ {
    gzip off;
    proxy_buffering off;
    proxy_pass $lms_app;
  }

  # Next.js build assets are content-hashed, so they can be cached for a long time.
  location /_next/static/ {
    proxy_pass $lms_app;
    # add_header here replaces the server-level headers, so repeat the ones that matter.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location / {
    proxy_pass $lms_app;
  }
}
