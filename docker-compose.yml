# On-premise deployment. Build the images once while the server has internet access (or load
# them with `docker load`); after that nothing here needs the internet. See docs/INSTALL.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=4GB", "-c", "max_connections=100", "-c", "effective_cache_size=10GB"]
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: lms-app
    # Node uses one CPU core per process, so several replicas share the load. Nginx spreads
    # requests across them. 3 replicas suit an 8 vCPU server (see docs/ARCHITECTURE.md).
    deploy:
      replicas: ${APP_REPLICAS:-3}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lms:${POSTGRES_PASSWORD}@db:5432/lms
      FILE_STORAGE_DIR: /app/storage
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env (for example smtp://user:pass@smtp.example.com:587)}
      MAIL_FROM: ${MAIL_FROM:-lms@3cit.local}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    # Reachable only through Nginx, never directly from the LAN.
    expose:
      - "3000"
    volumes:
      - storage:/app/storage
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/lms.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }
    restart: unless-stopped

  # Runs the scheduled work once an hour: opens new assessment periods, marks overdue
  # ones, and sends reminders. Uses busybox wget, which is part of the image.
  scheduler:
    image: alpine:3.20
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    command:
      - sh
      - -c
      - |
        while true; do
          wget -q -O- --header "Authorization: Bearer $$CRON_SECRET" --post-data="" http://app:3000/api/cron/reminders || echo "scheduler: run failed"
          sleep 3600
        done
    restart: unless-stopped

  # Daily encrypted backup of the database and uploaded files into ./backups.
  backup:
    build: ./deploy/backup
    image: lms-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: lms
      PGDATABASE: lms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Asia/Kolkata}
      STORAGE_DIR: /storage
      BACKUP_DIR: /backups
    volumes:
      - storage:/storage
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    restart: unless-stopped

volumes:
  pgdata:
  storage:
