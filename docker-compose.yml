services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lms:${POSTGRES_PASSWORD}@db:5432/lms
      FILE_STORAGE_DIR: /app/storage
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env (for example smtp://user:pass@smtp.example.com:587)}
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage

  # Runs the scheduled work once an hour: opens new assessment periods, marks overdue
  # ones, and sends reminders. Without it, recurring assessments do not roll over.
  scheduler:
    image: alpine:3.20
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    command:
      - sh
      - -c
      - |
        apk add --no-cache wget >/dev/null
        while true; do
          wget -q -O- --header "Authorization: Bearer $$CRON_SECRET" --post-data="" http://app:3000/api/cron/reminders || echo "scheduler: run failed"
          sleep 3600
        done
    restart: unless-stopped

volumes:
  pgdata:
  storage:
